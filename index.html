<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#c4501e">
<title>MotoAtlas — Motorrad-Routen DE · BE · NL · FR · IT</title>
<meta name="description" content="Kuratierte Motorrad-GPX-Routen für DE, BE, NL, FR und IT — interaktive Karte, direkt in Scenic importierbar.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,700;0,9..144,900;1,9..144,300;1,9..144,400&family=JetBrains+Mono:wght@400;500;600&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div id="root">
  <div class="atlas-loading">Lade Routen…</div>
</div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

<script type="text/babel" src="/data.jsx"></script>
<script type="text/babel" src="/sidebar.jsx"></script>
<script type="text/babel" src="/app.jsx"></script>

<script>
  // Poll until Babel has transpiled all JSX and set window.MotoAtlasApp
  (function poll() {
    if (window.MotoAtlasApp && window.Sidebar && window.transformRoute) {
      ReactDOM.createRoot(document.getElementById('root'))
        .render(React.createElement(window.MotoAtlasApp));
    } else {
      setTimeout(poll, 50);
    }
  })();
</script>
</body>
</html>
