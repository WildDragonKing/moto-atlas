name: Build and Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - run: pnpm install

      - name: Build catalog.json
        run: python scripts/build_catalog.py

      - name: Build Scenic ZIP collections
        run: |
          mkdir -p collections
          python3 scripts/build_collections.py

      - name: Vite build
        run: pnpm build

      - name: Copy assets to dist
        run: |
          cp catalog.json dist/
          [ -d routes ] && cp -r routes dist/ || true
          [ -d collections ] && cp -r collections dist/ || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
